[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-slack-bridge"
version = "0.1.0"
description = "A local, allowlisted Slack Socket Mode bridge to Codex App Server"
requires-python = ">=3.11"
dependencies = ["slack-sdk==3.45.0"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
codex-slack-bridge = "codex_slack_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
